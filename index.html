import sys

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "web_minicity"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/web_minicity
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("web_minicity.apk?v=4.7.86", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("web_minicity.tar.gz?v=4.7.86", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = str(main)

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = str(main)


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(str(main), callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script>
    // Langue de l'interface (francais / anglais) : la meme que celle choisie dans le jeu.
    window.mcLang = "fr";
    function mcT(fr, en) { return window.mcLang === "en" ? en : fr; }
    window.mcSetLang = function (lang) {
        window.mcLang = (lang === "en") ? "en" : "fr";
        document.documentElement.lang = window.mcLang;
        document.querySelectorAll("[data-en]").forEach(function (e) { e.textContent = window.mcLang === "en" ? e.getAttribute("data-en") : e.getAttribute("data-fr"); });
        document.querySelectorAll("[data-title-en]").forEach(function (e) {
            if (!e.hasAttribute("data-title-fr")) e.setAttribute("data-title-fr", e.getAttribute("title") || "");
            e.setAttribute("title", window.mcLang === "en" ? e.getAttribute("data-title-en") : e.getAttribute("data-title-fr"));
        });
        var nav = document.getElementById("touchbar");
        if (nav) {
            if (!nav.hasAttribute("data-aria-fr")) nav.setAttribute("data-aria-fr", nav.getAttribute("aria-label") || "");
            nav.setAttribute("aria-label", window.mcLang === "en" ? nav.getAttribute("data-aria-en") : nav.getAttribute("data-aria-fr"));
        }
        var info = document.getElementById("villes-info");
        if (info && /^(Chargement|Loading)/.test(info.textContent)) info.textContent = mcT("Chargement de la liste...", "Loading the list...");
    };
    (function () {
        var l = "";
        try { l = localStorage.getItem("minicity_lang") || ""; } catch (_) {}
        if (!l) l = (navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
        window.addEventListener("DOMContentLoaded", function () { window.mcSetLang(l); });
        window.mcLang = l;
    })();
</script>

    <script type="application/javascript">

    function sendMiniCityKey(key, ctrl=false) {
        const code = key === ' ' ? 'Space' : (key.length === 1 ? 'Key'+key.toUpperCase() : key);
        const opts = {key:key, code:code, ctrlKey:ctrl, bubbles:true, cancelable:true};
        window.dispatchEvent(new KeyboardEvent('keydown', opts));
        window.dispatchEvent(new KeyboardEvent('keyup', opts));
        canvas.focus();
    }

    const touchCommands = {
        '0':'curseur', 'x':'effacer', 'r':'rotation', 't':'virage',
        'z':'annuler', ' ':'pause', 'v':'vue', 'Escape':'fin_trace'
    };

    function sendMiniCityCommand(button) {
        const command = touchCommands[button.dataset.key];
        if (!command) return;
        localStorage.setItem('minicity:commande_tactile', Date.now()+':'+command);
        button.classList.add('is-pressed');
        setTimeout(() => button.classList.remove('is-pressed'), 220);
    }

    document.querySelectorAll('#touchbar [data-key]').forEach(button => {
        button.addEventListener('pointerdown', event => {
            event.preventDefault();
            sendMiniCityCommand(button);
        });
    });

    function updateTouchButtons() {
        const active = localStorage.getItem('minicity:outil_tactile') || 'curseur';
        document.querySelectorAll('#touchbar [data-key]').forEach(button => {
            const command = touchCommands[button.dataset.key];
            button.classList.toggle('is-active', command === active);
        });
    }
    updateTouchButtons();
    setInterval(updateTouchButtons, 150);

    async function basculerPleinEcran() {
        // Safari sur iPad n'accepte que les fonctions prefixees webkit.
        const el = document.documentElement;
        const actif = document.fullscreenElement || document.webkitFullscreenElement;
        try {
            if (!actif) {
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) await document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        } catch (_) {
            try { if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (__) {}
        }
        canvas.focus();
    }
    document.getElementById('fullscreen').addEventListener('click', basculerPleinEcran);
    // F11 : le navigateur ferait son propre plein ecran sans que le jeu s'adapte ;
    // on le remplace par le plein ecran de la page.
    window.addEventListener('keydown', (e) => {
        if (e.key === 'F11') { e.preventDefault(); e.stopImmediatePropagation(); basculerPleinEcran(); }
    }, true);

    document.getElementById('save-city').addEventListener('click', async () => {
        const current = localStorage.getItem('minicity:derniere') || 'ville';
        const name = prompt('Nom de la ville', current);
        if (!name) return;
        sendMiniCityKey('F5');
        await new Promise(resolve => setTimeout(resolve, 180));
        for (let i=0; i<80; i++) sendMiniCityKey('Backspace');
        for (const character of name.slice(0,40)) sendMiniCityKey(character);
        sendMiniCityKey('Enter');
    });

    document.getElementById('export-city').addEventListener('click', () => {
        const name = localStorage.getItem('minicity:derniere') || 'ville';
        const data = localStorage.getItem('minicity:ville:'+name);
        if (!data) { alert(mcT('Sauvegardez d abord la ville dans MINICITY.','Save the city in MINICITY first.')); return; }
        const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
        const a = document.createElement('a'); a.href=url; a.download=name+'.json'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    document.getElementById('import-city').addEventListener('change', async event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!Array.isArray(data.grille)) throw new Error('format');
            const name = file.name.replace(/\.json$/i,'').replace(/[^a-zA-Z0-9_-]/g,'_') || 'ville_importee';
            localStorage.setItem('minicity:ville:'+name, JSON.stringify(data));
            localStorage.setItem('minicity:derniere', name);
            location.reload();
        } catch (_) { alert(mcT('Ce fichier ne contient pas une ville MINICITY valide.','This file does not contain a valid MINICITY city.')); }
    });

    // --- Villes en ligne : fichiers .json du dossier villes/ du site -------------
    // 1) villes/liste.json (facultatif) : ["nom1","nom2"] ou [{"nom":..,"fichier":..}]
    // 2) sinon, sur GitHub Pages, le contenu du dossier villes/ du depot (API GitHub).
    async function listeVillesEnLigne() {
        try {
            const r = await fetch('villes/liste.json?t='+Date.now(), {cache:'no-store'});
            if (r.ok) {
                const l = await r.json();
                return l.map(v => typeof v === 'string' ? {nom:v, fichier:v.endsWith('.json') ? v : v+'.json'}
                                                        : {nom:v.nom || v.fichier, fichier:v.fichier});
            }
        } catch (_) {}
        const h = location.hostname;
        if (h.endsWith('.github.io')) {
            const owner = h.split('.')[0];
            const segs = location.pathname.split('/').filter(Boolean);
            const repo = (segs.length && !segs[0].includes('.')) ? segs[0] : h;
            const r = await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/villes', {cache:'no-store'});
            if (r.ok) {
                const l = await r.json();
                return l.filter(f => f.type === 'file' && f.name.endsWith('.json') && !f.name.startsWith('_') && f.name !== 'liste.json')
                        .map(f => ({nom:f.name.replace(/\.json$/i,''), fichier:f.name}));
            }
        }
        return [];
    }
    const villesPanel = document.getElementById('villes-panel');
    document.getElementById('villes-fermer').addEventListener('click', () => { villesPanel.classList.remove('ouvert'); canvas.focus(); });
    document.getElementById('villes-ouvrir').addEventListener('click', async () => {
        const info = document.getElementById('villes-info'), liste = document.getElementById('villes-liste');
        info.textContent = mcT('Chargement de la liste...','Loading the list...'); liste.innerHTML = '';
        villesPanel.classList.add('ouvert');
        let villes = [];
        try { villes = await listeVillesEnLigne(); } catch (_) {}
        if (!villes.length) { info.textContent = mcT('Aucune ville trouvee dans le dossier villes/ du site.','No city found in the site\'s villes/ folder.'); return; }
        info.textContent = mcT('Touchez une ville pour l\'ouvrir. La ville en cours non sauvegardee sera perdue.','Tap a city to open it. The current city will be lost if not saved.');
        for (const v of villes.sort((a,b) => a.nom.localeCompare(b.nom))) {
            const b = document.createElement('button'); b.type = 'button'; b.textContent = v.nom.replace(/_/g,' ');
            b.addEventListener('click', async () => {
                try {
                    const r = await fetch('villes/'+encodeURIComponent(v.fichier)+'?t='+Date.now(), {cache:'no-store'});
                    const data = await r.json();
                    if (!Array.isArray(data.grille)) throw new Error('format');
                    const name = v.nom.replace(/[^a-zA-Z0-9_-]/g,'_') || 'ville';
                    localStorage.setItem('minicity:ville:'+name, JSON.stringify(data));
                    localStorage.setItem('minicity:derniere', name);
                    location.reload();
                } catch (_) { alert(mcT('Impossible d\'ouvrir cette ville.','Unable to open this city.')); }
            });
            liste.appendChild(b);
        }
    });

    window.addEventListener('load', () => {
        canvas.style.touchAction = 'none';
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    });
